<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>X Recall — User Flow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;line-height:1.6}
.hero{background:#fff;border-bottom:1px solid #e5e5e0;padding:52px 32px 44px;text-align:center}
.hero-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.x-logo{width:24px;height:24px;fill:#000}
.badge{background:#1D9BF0;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:20px;text-transform:uppercase}
.hero h1{font-size:30px;font-weight:700;color:#0f0f0f;letter-spacing:-.5px;margin-bottom:8px}
.hero p{font-size:14px;color:#555;max-width:520px;margin:0 auto 24px;line-height:1.6}
.hero-links{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.proto-btn{display:inline-flex;align-items:center;gap:6px;background:#000;color:#fff;font-size:13px;font-weight:600;padding:9px 20px;border-radius:22px;text-decoration:none}
.sec-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1a1a1a;font-size:13px;font-weight:600;padding:8px 18px;border-radius:22px;text-decoration:none;border:1px solid #d0d0c8}
.wrap{max-width:900px;margin:0 auto;padding:48px 24px 80px}
.phase-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.phase-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.phase-letter{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.pa .phase-pill{background:#EBF5FF;color:#185FA5}.pa .phase-letter{background:#1D9BF0;color:#fff}
.pb .phase-pill{background:#F0EFFE;color:#3C3489}.pb .phase-letter{background:#534AB7;color:#fff}
.pc .phase-pill{background:#E3F6EF;color:#085041}.pc .phase-letter{background:#0F6E56;color:#fff}
.pd .phase-pill{background:#FEF4E3;color:#633806}.pd .phase-letter{background:#854F0B;color:#fff}
.pe .phase-pill{background:#FAEEE9;color:#712B13}.pe .phase-letter{background:#993C1D;color:#fff}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g1{grid-template-columns:1fr}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:10px;padding:18px 18px 16px;position:relative}
.card-num{position:absolute;top:-11px;left:16px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid #f5f5f0;color:#fff}
.card-tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;margin-top:2px}
.card-title{font-size:14px;font-weight:700;color:#0f0f0f;margin-bottom:5px;line-height:1.4}
.card-desc{font-size:12px;color:#666;margin-bottom:12px;line-height:1.55}
.card-features{list-style:none;display:flex;flex-direction:column;gap:5px}
.card-features li{font-size:12px;color:#444;display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.card-features li::before{content:'';width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px}
.card-cta{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px}
.pa .card-num{background:#1D9BF0}.pa .card-tag{color:#1D9BF0}.pa .card-features li::before{background:#1D9BF0}.pa .card-cta{background:#EBF5FF;color:#185FA5}
.pb .card-num{background:#534AB7}.pb .card-tag{color:#534AB7}.pb .card-features li::before{background:#7F77DD}.pb .card-cta{background:#F0EFFE;color:#3C3489}
.pc .card-num{background:#0F6E56}.pc .card-tag{color:#0F6E56}.pc .card-features li::before{background:#1D9E75}.pc .card-cta{background:#E3F6EF;color:#085041}
.pd .card-num{background:#854F0B}.pd .card-tag{color:#854F0B}.pd .card-features li::before{background:#BA7517}.pd .card-cta{background:#FEF4E3;color:#633806}
.pe .card-num{background:#993C1D}.pe .card-tag{color:#993C1D}.pe .card-features li::before{background:#D85A30}.pe .card-cta{background:#FAEEE9;color:#712B13}
.cab{border-color:#B5D4F4;background:#FAFCFF}
.cap{border-color:#CECBF6;background:#FDFCFF}
.cat{border-color:#9FE1CB;background:#FAFFFE}
.cac{border-color:#F5C4B3;background:#FFFAF8}
.decision-wrap{display:flex;justify-content:center;margin:4px 0}
.decision{background:#fff;border:1.5px solid #d0d0c8;border-radius:8px;padding:14px 20px;text-align:center;max-width:440px;width:100%}
.decision-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aaa;margin-bottom:4px}
.decision-q{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:10px}
.decision-branches{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.branch{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px}
.br-yes{background:#E3F6EF;color:#085041;border:1px solid #5DCAA5}
.br-no{background:#FEF4E3;color:#633806;border:1px solid #EF9F27}
.br-a{background:#EBF5FF;color:#185FA5;border:1px solid #85B7EB}
.br-b{background:#F0EFFE;color:#3C3489;border:1px solid #AFA9EC}
.br-c{background:#FAEEE9;color:#712B13;border:1px solid #F0997B}
.br-d{background:#E3F6EF;color:#085041;border:1px solid #5DCAA5}
.conn{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.conn-line{width:1.5px;height:22px;background:#d0d0c8}
.conn-arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #c0c0b8}
.psep{height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
@media(max-width:520px){.sub-grid{grid-template-columns:1fr}}
.sub-card{background:#f9f9f6;border:1px solid #e8e8e2;border-radius:8px;padding:14px}
.sub-card-title{font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:5px}
.sub-card-body{font-size:12px;color:#666;line-height:1.5}
.legend{margin-top:44px;padding:18px 20px;background:#fff;border:1px solid #e5e5e0;border-radius:10px}
.legend-title{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#aaa;margin-bottom:12px}
.legend-grid{display:flex;flex-wrap:wrap;gap:10px 20px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#555}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.gap{height:28px}.gap-sm{height:16px}
</style>
</head>

<body>

<div class="hero">
  <div class="hero-top">
    <svg class="x-logo" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    <span class="badge">X Recall</span>
  </div>

  <h1>User Flow</h1>
  <p>End-to-end journey from app open through feed scroll, AI classification, library management, and correction loop</p>

  <div class="hero-links">
    <a href="https://x-recall-prototype.vercel.app/" class="proto-btn" target="_blank">View live prototype</a>
    <a href="https://github.com/prodXsg/X_Recall_prototype" class="sec-btn" target="_blank">GitHub repo</a>
  </div>
</div>

<div class="wrap">
<!-- YOUR ENTIRE ORIGINAL FLOW CONTINUES EXACTLY SAME -->
</div>

</body>
</html>
